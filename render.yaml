services:
  - type: web
    name: robbiechaux-kicks-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm --workspace server run build
    startCommand: npm --workspace server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: robbie_shoes
      - key: CORS_ORIGINS
        value: https://robbiechaux-kicks.onrender.com

  - type: web
    name: robbiechaux-kicks
    runtime: static
    buildCommand: npm ci && npm --workspace client run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://robbiechaux-kicks-api.onrender.com
      - key: VITE_CATALOG_MODE
        value: api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
